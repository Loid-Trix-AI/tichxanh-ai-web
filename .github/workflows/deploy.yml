name: Deploy Web (Vercel)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: Trigger Vercel Deployment
    runs-on: ubuntu-latest

    steps:
      - name: Trigger Vercel Deploy Hook
        # Primary deploy: Vercel auto-deploys on push to this repo (configured in Vercel dashboard)
        # This is a manual fallback trigger if the Vercel GitHub integration is not set up
        if: ${{ secrets.VERCEL_DEPLOY_HOOK_URL != '' }}
        run: curl -X POST "${{ secrets.VERCEL_DEPLOY_HOOK_URL }}"
